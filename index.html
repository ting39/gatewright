<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gatewright: build a computer from NAND</title>
<meta name="description" content="A puzzle game: start with a single NAND gate and wire your way up to a working 8-bit CPU, then program it.">
<meta name="theme-color" content="#0d1220">
<meta property="og:type" content="website">
<meta property="og:title" content="Gatewright: build a computer from NAND">
<meta property="og:description" content="A puzzle game: start with one NAND gate and wire your way up to a working 8-bit CPU, then program it.">
<meta property="og:url" content="https://ting39.github.io/gatewright/">
<meta property="og:image" content="https://ting39.github.io/gatewright/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1220'/%3E%3Cpath d='M7 8h9a8 8 0 0 1 0 16H7z' fill='none' stroke='%23ffb84d' stroke-width='2.5'/%3E%3Ccircle cx='26' cy='16' r='2.6' fill='none' stroke='%23ffb84d' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button class="brand" id="btnLevels" aria-label="Level map">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="M5 7h10a9 9 0 0 1 0 18H5z" fill="none" stroke="currentColor" stroke-width="2.6"/><circle cx="27" cy="16" r="2.8" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
      <span>Gatewright</span>
    </button>
    <div class="crumbs" id="crumbs"></div>
    <div class="spacer"></div>
    <a class="tb home" href="https://ting39.github.io/" title="Back to ting39's homepage">← ting39</a>
    <button class="tb" id="btnSandbox" title="Sandbox: build anything">Sandbox</button>
    <button class="tb icon" id="btnHelp" title="Controls (?)" aria-label="Help">?</button>
    <button class="tb icon" id="btnSound" title="Sound on/off" aria-label="Toggle sound">♪</button>
    <button class="tb icon" id="btnMenu" title="Save, export, import" aria-label="Menu">⋯</button>
  </header>

  <main id="work">
    <aside id="bin" aria-label="Parts bin"></aside>
    <section id="stage">
      <canvas id="board" tabindex="0" role="application" aria-label="Circuit board. Drag parts from the bin, drag between pins to wire."></canvas>
      <div id="inspector" class="float" hidden></div>
      <div id="busEdit" class="float" hidden><input type="number" min="0" id="busInput" aria-label="Bus value"><span id="busHex"></span></div>
      <div id="toolbar" class="float">
        <button id="tUndo" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
        <button id="tRedo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button>
        <span class="sep"></span>
        <button id="tZoomOut" title="Zoom out" aria-label="Zoom out">−</button>
        <button id="tFit" title="Fit to screen (F)" aria-label="Fit">⤢</button>
        <button id="tTidy" title="Tidy: auto-arrange everything by logic depth (L). Undo restores your layout." aria-label="Tidy layout">⊞</button>
        <button id="tZoomIn" title="Zoom in" aria-label="Zoom in">+</button>
        <span class="sep clockonly"></span>
        <button id="tTick" class="clockonly" title="Clock tick (Enter)">Tick</button>
        <button id="tRun" class="clockonly" title="Run the clock">▶</button>
        <button id="tReset" class="clockonly" title="Reset memory to 0">⟲</button>
        <span id="tCycles" class="clockonly mono"></span>
      </div>
      <div id="stats" class="float mono"></div>
    </section>
    <section id="machine" hidden></section>
    <aside id="panel">
      <button id="panelToggle" aria-label="Show brief">Brief</button>
      <div id="panelBody"></div>
    </aside>
  </main>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" hidden><div class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="phone" hidden>
  <div class="sheet">
    <h2>Gatewright needs room</h2>
    <p>This is a wiring game. It works best on a tablet or computer, where there's space to lay out chips.</p>
    <button id="phoneGo" class="primary">Try anyway</button>
    <p class="phone-home"><a href="https://ting39.github.io/">← back to ting39's homepage</a></p>
  </div>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<script type="module" src="src/app.js"></script>
</body>
</html>
